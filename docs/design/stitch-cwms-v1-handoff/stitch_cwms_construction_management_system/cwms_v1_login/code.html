<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CWMS - Login</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<!-- Tailwind Config -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "secondary-fixed": "#d8e2ff",
                        "error-container": "#ffdad6",
                        "on-secondary-fixed": "#001a42",
                        "on-surface-variant": "#45464d",
                        "inverse-primary": "#bec6e0",
                        "surface-container-highest": "#d3e4fe",
                        "outline-variant": "#c6c6cd",
                        "on-primary-fixed": "#131b2e",
                        "surface-container-high": "#dce9ff",
                        "on-secondary-container": "#fefcff",
                        "surface-bright": "#f8f9ff",
                        "surface-dim": "#cbdbf5",
                        "outline": "#76777d",
                        "secondary-container": "#2170e4",
                        "primary": "#000000",
                        "surface-container": "#e5eeff",
                        "tertiary-fixed-dim": "#c0c1ff",
                        "secondary": "#0058be",
                        "surface-container-lowest": "#ffffff",
                        "background": "#f8f9ff",
                        "surface": "#f8f9ff",
                        "on-primary": "#ffffff",
                        "surface-tint": "#565e74",
                        "primary-fixed": "#dae2fd",
                        "on-primary-fixed-variant": "#3f465c",
                        "on-tertiary": "#ffffff",
                        "tertiary": "#000000",
                        "surface-variant": "#d3e4fe",
                        "primary-fixed-dim": "#bec6e0",
                        "error": "#ba1a1a",
                        "on-secondary": "#ffffff",
                        "on-error-container": "#93000a",
                        "tertiary-container": "#07006c",
                        "on-tertiary-fixed-variant": "#2f2ebe",
                        "on-error": "#ffffff",
                        "inverse-on-surface": "#eaf1ff",
                        "on-primary-container": "#7c839b",
                        "primary-container": "#131b2e",
                        "on-background": "#0b1c30",
                        "on-tertiary-container": "#7073ff",
                        "inverse-surface": "#213145",
                        "surface-container-low": "#eff4ff",
                        "on-surface": "#0b1c30",
                        "secondary-fixed-dim": "#adc6ff",
                        "on-tertiary-fixed": "#07006c",
                        "tertiary-fixed": "#e1e0ff",
                        "on-secondary-fixed-variant": "#004395"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "xl": "32px",
                        "sm": "8px",
                        "margin": "24px",
                        "xs": "4px",
                        "lg": "24px",
                        "container-max": "1440px",
                        "base": "4px",
                        "md": "16px",
                        "gutter": "16px"
                    },
                    fontFamily: {
                        "display-lg-mobile": ["Geist", "sans-serif"],
                        "display-lg": ["Geist", "sans-serif"],
                        "numeric-data": ["JetBrains Mono", "monospace"],
                        "label-caps": ["Geist", "sans-serif"],
                        "body-base": ["Geist", "sans-serif"],
                        "headline-md": ["Geist", "sans-serif"],
                        "body-sm": ["Geist", "sans-serif"]
                    },
                    fontSize: {
                        "display-lg-mobile": ["24px", { lineHeight: "32px", letterSpacing: "-0.01em", fontWeight: "600" }],
                        "display-lg": ["32px", { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "600" }],
                        "numeric-data": ["14px", { lineHeight: "20px", fontWeight: "500" }],
                        "label-caps": ["11px", { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "600" }],
                        "body-base": ["14px", { lineHeight: "20px", fontWeight: "400" }],
                        "headline-md": ["20px", { lineHeight: "28px", letterSpacing: "-0.01em", fontWeight: "600" }],
                        "body-sm": ["13px", { lineHeight: "18px", fontWeight: "400" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background min-h-screen flex flex-col items-center justify-center p-md text-on-surface antialiased selection:bg-surface-variant selection:text-on-surface">
<!-- Decorative background elements for depth without heavy shadows -->
<div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-surface-container-highest/20 rounded-full blur-3xl"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-surface-container-high/30 rounded-full blur-3xl"></div>
</div>
<!-- Main Content Canvas -->
<main class="relative z-10 w-full max-w-[420px] flex flex-col items-center">
<!-- Brand Header -->
<header class="w-full text-center mb-xl">
<div class="inline-flex items-center justify-center w-12 h-12 bg-primary rounded-lg mb-md">
<span class="material-symbols-outlined text-on-primary text-[28px]" style="font-variation-settings: 'FILL' 1;">precision_manufacturing</span>
</div>
<h1 class="font-display-lg text-display-lg text-on-surface mb-xs tracking-tight">CWMS</h1>
<p class="font-body-base text-body-base text-on-surface-variant">Construction Work Management System</p>
</header>
<!-- Error Banner Placeholder (Hidden by default, shown here for structure preview) -->
<div class="w-full bg-error-container border border-on-error-container/20 rounded-lg p-md mb-lg flex items-start gap-sm hidden" id="error-banner">
<span class="material-symbols-outlined text-on-error-container text-[20px] mt-[2px]">error</span>
<div class="flex-1">
<p class="font-body-sm text-body-sm text-on-error-container font-semibold">Authentication Failed</p>
<p class="font-body-sm text-body-sm text-on-error-container/80 mt-xs">The username or password provided is incorrect.</p>
</div>
</div>
<!-- Login Card -->
<div class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl p-xl shadow-[0_4px_6px_-1px_rgb(0,0,0,0.05),0_2px_4px_-2px_rgb(0,0,0,0.05)]">
<h2 class="font-headline-md text-headline-md text-on-surface mb-lg">Log in to your account</h2>
<form class="flex flex-col gap-md" id="login-form" onsubmit="event.preventDefault(); simulateError();">
<!-- Username -->
<div class="flex flex-col gap-xs">
<label class="font-body-sm text-body-sm text-on-surface-variant" for="username">Username</label>
<input autocomplete="username" class="w-full h-10 px-md bg-surface border border-outline-variant rounded-DEFAULT font-body-base text-body-base text-on-surface placeholder:text-outline focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-all" id="username" name="username" placeholder="Enter your CWMS ID" required="" type="text"/>
</div>
<!-- Password -->
<div class="flex flex-col gap-xs">
<label class="font-body-sm text-body-sm text-on-surface-variant" for="password">Password</label>
<div class="relative flex items-center">
<input autocomplete="current-password" class="w-full h-10 pl-md pr-12 bg-surface border border-outline-variant rounded-DEFAULT font-body-base text-body-base text-on-surface placeholder:text-outline focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-all" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-sm p-sm text-on-surface-variant hover:text-on-surface transition-colors flex items-center justify-center rounded-DEFAULT focus:outline-none focus:ring-2 focus:ring-secondary/50" id="toggle-password" type="button">
<span class="material-symbols-outlined text-[20px]" id="visibility-icon">visibility</span>
</button>
</div>
</div>
<!-- Options Row -->
<div class="flex items-center justify-between mt-xs mb-sm">
<label class="flex items-center gap-sm cursor-pointer group">
<input class="w-4 h-4 rounded-sm border-outline-variant text-secondary bg-surface focus:ring-secondary focus:ring-offset-surface-container-lowest cursor-pointer" name="remember" type="checkbox"/>
<span class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Remember me</span>
</label>
<a class="font-body-sm text-body-sm text-secondary hover:text-primary transition-colors hover:underline underline-offset-2" href="#">Forgot password?</a>
</div>
<!-- Submit Button -->
<button class="w-full h-10 bg-primary text-on-primary font-body-base text-body-base font-semibold rounded-DEFAULT hover:bg-on-surface transition-colors flex items-center justify-center gap-sm active:scale-[0.98]" type="submit">
                    Log In
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
</div>
<!-- Footer Links -->
<div class="mt-lg flex items-center gap-md">
<a class="font-body-sm text-body-sm text-outline hover:text-on-surface transition-colors" href="#">Help Center</a>
<div class="w-1 h-1 rounded-full bg-outline-variant"></div>
<a class="font-body-sm text-body-sm text-outline hover:text-on-surface transition-colors" href="#">Privacy Policy</a>
</div>
</main>
<!-- Interactions Script -->
<script>
        // Password Visibility Toggle
        const passwordInput = document.getElementById('password');
        const toggleButton = document.getElementById('toggle-password');
        const visibilityIcon = document.getElementById('visibility-icon');

        toggleButton.addEventListener('click', () => {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                visibilityIcon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                visibilityIcon.textContent = 'visibility';
            }
        });

        // Simulate Error State (For demonstration)
        function simulateError() {
            const errorBanner = document.getElementById('error-banner');
            errorBanner.classList.remove('hidden');
            
            // Add a subtle shake animation to the form container
            const formCard = errorBanner.nextElementSibling;
            formCard.animate([
                { transform: 'translateX(0)' },
                { transform: 'translateX(-4px)' },
                { transform: 'translateX(4px)' },
                { transform: 'translateX(-4px)' },
                { transform: 'translateX(0)' }
            ], {
                duration: 400,
                easing: 'ease-in-out'
            });

            // Auto-hide after 5 seconds
            setTimeout(() => {
                errorBanner.classList.add('hidden');
            }, 5000);
        }
    </script>
</body></html>
