openapi: 3.1.0
info:
  title: CWMS Construction Work Management System API
  version: 1.0.0
  summary: Implementation-agnostic HTTP API for CWMS v1.0 web application
  description: |
    Architecture-level OpenAPI 3.1 specification for CWMS Version 1.0.
    Not tied to any framework. Traceability to Functional Specification is via
    `x-fs-refs` on operations and the companion API-CATALOGUE.md.
    Money amounts are decimal strings. Dates are ISO-8601.
  license:
    name: Proprietary

servers:
  - url: /api/v1
    description: Version 1 API base path

tags:
  - name: Auth
  - name: Users
  - name: Masters
  - name: Dashboard
  - name: Works
  - name: Estimates
  - name: Schedule
  - name: Documents
  - name: Billing
  - name: Expenditure
  - name: Reports
  - name: Search
  - name: Backups
  - name: Audit
  - name: Platform

security:
  - sessionAuth: []
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: authLogin
      x-fs-refs: [F-AUTH-01, F-AUTH-01A, F-AUTH-01B, PRD-AUTH]
      x-prd-refs: [PRD-AUTH]
      x-br-refs: [BR-SEC-01, BR-SEC-03]
      security: []
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Inactive account
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: authLogout
      x-fs-refs: [F-AUTH-03]
      summary: Sign out
      responses:
        '204':
          description: Logged out
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Auth]
      operationId: authMe
      x-fs-refs: [G-01]
      summary: Current user profile
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/change-password:
    post:
      tags: [Auth]
      operationId: authChangePassword
      x-fs-refs: [F-AUTH-02]
      x-br-refs: [BR-SEC-02]
      summary: Change password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: authRefresh
      x-fs-refs: [F-AUTH-01A]
      summary: Refresh session / Remember Me
      responses:
        '200':
          description: Session extended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users:
    get:
      tags: [Users]
      operationId: listUsers
      x-fs-refs: [F-USR-01, F-USR-02]
      x-prd-refs: [PRD-ADM]
      summary: List users
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: q
          in: query
          schema: { type: string }
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/Role' }
        - name: active
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Page of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Users]
      operationId: createUser
      x-fs-refs: [F-USR-01]
      x-br-refs: [BR-SEC-02, BR-ID-06]
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      operationId: getUser
      x-fs-refs: [F-USR-02]
      summary: Get user
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: OK
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [Users]
      operationId: updateUser
      x-fs-refs: [F-USR-02]
      summary: Update user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{userId}/deactivate:
    post:
      tags: [Users]
      operationId: deactivateUser
      x-fs-refs: [F-USR-02]
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Deactivated
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{userId}/activate:
    post:
      tags: [Users]
      operationId: activateUser
      x-fs-refs: [F-USR-02]
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Activated
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /masters/{masterType}:
    parameters:
      - $ref: '#/components/parameters/MasterType'
    get:
      tags: [Masters]
      operationId: listMasters
      x-fs-refs: [F-MST-02]
      x-prd-refs: [PRD-ADM]
      summary: List master values
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: q
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Master page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterOptionPage'
    post:
      tags: [Masters]
      operationId: createMaster
      x-fs-refs: [F-MST-01]
      x-br-refs: [BR-MST-01, BR-ID-07]
      summary: Create master value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MasterOptionCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterOption'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /masters/{masterType}/{masterId}:
    parameters:
      - $ref: '#/components/parameters/MasterType'
      - $ref: '#/components/parameters/MasterId'
    patch:
      tags: [Masters]
      operationId: updateMaster
      x-fs-refs: [F-MST-01]
      x-br-refs: [BR-MST-03]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MasterOptionUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterOption'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Masters]
      operationId: deleteMaster
      x-fs-refs: [F-MST-01]
      x-br-refs: [BR-MST-02]
      responses:
        '204':
          description: Deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: In use
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /dashboard/summary:
    get:
      tags: [Dashboard]
      operationId: getDashboardSummary
      x-fs-refs: [F-DASH-01]
      x-prd-refs: [PRD-DASH]
      summary: Dashboard KPI summary
      parameters:
        - name: financialYear
          in: query
          schema: { type: string, example: "2026-27" }
        - name: project
          in: query
          schema: { type: string }
      responses:
        '200':
          description: KPI payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'

  /dashboard/alerts:
    get:
      tags: [Dashboard]
      operationId: getDashboardAlerts
      x-fs-refs: [F-DASH-03]
      x-br-refs: [BR-BILL-13, BR-BILL-14, BR-STAT-03, BR-STAT-06, BR-STAT-07A]
      responses:
        '200':
          description: Alert counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardAlerts'

  /dashboard/attention:
    get:
      tags: [Dashboard]
      operationId: getDashboardAttention
      x-fs-refs: [F-DASH-02]
      x-br-refs: [BR-TL-01, BR-TL-02, BR-TL-03, BR-TL-04]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Attention list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkAttentionPage'

  /dashboard/recent:
    get:
      tags: [Dashboard]
      operationId: getDashboardRecent
      x-fs-refs: [F-DASH-05]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        '200':
          description: Recent items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecentActivityList'

  /works:
    get:
      tags: [Works]
      operationId: listWorks
      x-fs-refs: [F-WORK-01, F-WORK-02]
      x-prd-refs: [PRD-WORK, PRD-SRCH]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: q
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/WorkStatus' }
        - name: project
          in: query
          schema: { type: string }
        - name: client
          in: query
          schema: { type: string }
        - name: contractor
          in: query
          schema: { type: string }
        - name: categoryId
          in: query
          schema: { type: string }
        - name: trafficLight
          in: query
          schema: { $ref: '#/components/schemas/TrafficLight' }
        - name: workOrderDateFrom
          in: query
          schema: { type: string, format: date }
        - name: workOrderDateTo
          in: query
          schema: { type: string, format: date }
        - name: financialYear
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Work page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkPage'
    post:
      tags: [Works]
      operationId: createWork
      x-fs-refs: [F-WORK-04, F-WORK-04A, F-WORK-04B, F-FIN-01, F-FIN-02]
      x-br-refs: [BR-ID-01, BR-ID-04, BR-FIN-02, BR-FIN-03, BR-FIN-04, BR-FIN-05, BR-FIN-06, BR-FIN-07]
      x-prd-refs: [PRD-WORK]
      summary: Create work
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Work'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /works/project-names:
    get:
      tags: [Works]
      operationId: listProjectNames
      x-fs-refs: [F-WORK-04]
      x-br-refs: [BR-PRJ-02]
      parameters:
        - name: q
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Distinct project names
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { type: string }

  /works/{workId}:
    parameters:
      - $ref: '#/components/parameters/WorkId'
    get:
      tags: [Works]
      operationId: getWork
      x-fs-refs: [F-WORK-06]
      responses:
        '200':
          description: Work detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Work'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Works]
      operationId: updateWork
      x-fs-refs: [F-WORK-05]
      x-br-refs: [BR-CON-01]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Work'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Locked or conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      tags: [Works]
      operationId: deleteWork
      x-fs-refs: [F-WORK-07]
      x-br-refs: [BR-VAL-04]
      responses:
        '204':
          description: Deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Has children
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /works/{workId}/lock:
    parameters:
      - $ref: '#/components/parameters/WorkId'
    post:
      tags: [Works]
      operationId: acquireWorkLock
      x-fs-refs: [F-WORK-05]
      x-br-refs: [BR-CON-01]
      responses:
        '200':
          description: Lock acquired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkLock'
        '409':
          description: Held by another user
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      tags: [Works]
      operationId: releaseWorkLock
      x-fs-refs: [F-WORK-05]
      x-br-refs: [BR-CON-01]
      responses:
        '204':
          description: Released
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /works/{workId}/financial-summary:
    get:
      tags: [Works]
      operationId: getWorkFinancialSummary
      x-fs-refs: [F-WORK-06, F-FIN-03, F-FIN-04]
      x-br-refs: [BR-FIN-08, BR-FIN-09, BR-FIN-10, BR-FIN-11, BR-FIN-12, BR-FIN-13]
      parameters:
        - $ref: '#/components/parameters/WorkId'
      responses:
        '200':
          description: Financial card
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkFinancialSummary'

  /works/{workId}/estimates:
    parameters:
      - $ref: '#/components/parameters/WorkId'
    get:
      tags: [Estimates]
      operationId: listEstimates
      x-fs-refs: [F-EST-03]
      x-prd-refs: [PRD-EST]
      responses:
        '200':
          description: Estimates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateList'
    post:
      tags: [Estimates]
      operationId: createEstimate
      x-fs-refs: [F-EST-01]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstimateCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Estimate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /estimates/{estimateId}:
    parameters:
      - $ref: '#/components/parameters/EstimateId'
    get:
      tags: [Estimates]
      operationId: getEstimate
      x-fs-refs: [F-EST-03]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Estimate'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Estimates]
      operationId: updateEstimate
      x-fs-refs: [F-EST-02]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstimateUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Estimate'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Estimates]
      operationId: deleteEstimate
      x-fs-refs: [F-EST-02]
      responses:
        '204':
          description: Deleted
        '403':
          $ref: '#/components/responses/Forbidden'

  /works/{workId}/schedule-activities:
    parameters:
      - $ref: '#/components/parameters/WorkId'
    get:
      tags: [Schedule]
      operationId: listScheduleActivities
      x-fs-refs: [F-SCH-01]
      x-prd-refs: [PRD-SCH]
      responses:
        '200':
          description: Activities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleActivityList'
    post:
      tags: [Schedule]
      operationId: createScheduleActivity
      x-fs-refs: [F-SCH-01]
      x-br-refs: [BR-STAT-04, BR-STAT-05]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleActivityCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleActivity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /schedule-activities/{activityId}:
    parameters:
      - $ref: '#/components/parameters/ActivityId'
    patch:
      tags: [Schedule]
      operationId: updateScheduleActivity
      x-fs-refs: [F-SCH-03]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleActivityUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleActivity'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Schedule]
      operationId: deleteScheduleActivity
      x-fs-refs: [F-SCH-03]
      responses:
        '204':
          description: Deleted
        '403':
          $ref: '#/components/responses/Forbidden'

  /documents:
    get:
      tags: [Documents]
      operationId: listDocuments
      x-fs-refs: [F-DOC-05]
      x-prd-refs: [PRD-DOC]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: q
          in: query
          schema: { type: string }
        - name: workId
          in: query
          schema: { type: string }
        - name: documentTypeId
          in: query
          schema: { type: string }
        - name: uploadedFrom
          in: query
          schema: { type: string, format: date }
        - name: uploadedTo
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Document page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentPage'

  /works/{workId}/documents:
    parameters:
      - $ref: '#/components/parameters/WorkId'
    get:
      tags: [Documents]
      operationId: listWorkDocuments
      x-fs-refs: [F-DOC-01]
      responses:
        '200':
          description: Documents for work
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentList'
    post:
      tags: [Documents]
      operationId: uploadDocument
      x-fs-refs: [F-DOC-01]
      x-br-refs: [BR-DOC-02, BR-DOC-03, BR-DOC-04]
      summary: Upload single document (multipart)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentUploadForm'
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          description: File too large
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: Unsupported type
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          $ref: '#/components/responses/Forbidden'

  /works/{workId}/documents:batch:
    post:
      tags: [Documents]
      operationId: uploadDocumentsBatch
      x-fs-refs: [F-DOC-02]
      x-br-refs: [BR-DOC-03, BR-DOC-04]
      parameters:
        - $ref: '#/components/parameters/WorkId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentBatchUploadForm'
      responses:
        '200':
          description: Batch result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentBatchUploadResult'
        '403':
          $ref: '#/components/responses/Forbidden'

  /documents/{documentId}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [Documents]
      operationId: getDocument
      x-fs-refs: [F-DOC-03]
      responses:
        '200':
          description: Metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Documents]
      operationId: deleteDocument
      x-fs-refs: [F-DOC-04]
      x-br-refs: [BR-DOC-06]
      parameters:
        - name: confirm
          in: query
