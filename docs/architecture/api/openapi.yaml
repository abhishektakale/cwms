components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: CWMSSESSION
      description: Server session cookie (implementation-defined name)
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Opaque bearer/session token alternative

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Sort:
      name: sort
      in: query
      description: field:asc|desc[,field:asc|desc]
      schema: { type: string }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string }
    WorkId:
      name: workId
      in: path
      required: true
      schema: { type: string }
    EstimateId:
      name: estimateId
      in: path
      required: true
      schema: { type: string }
    ActivityId:
      name: activityId
      in: path
      required: true
      schema: { type: string }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string }
    BillId:
      name: billId
      in: path
      required: true
      schema: { type: string }
    ExpenseId:
      name: expenseId
      in: path
      required: true
      schema: { type: string }
    MasterId:
      name: masterId
      in: path
      required: true
      schema: { type: string }
    MasterType:
      name: masterType
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/MasterType'
    ReportType:
      name: reportType
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ReportType'
    FilterId:
      name: filterId
      in: path
      required: true
      schema: { type: string }
    BackupId:
      name: backupId
      in: path
      required: true
      schema: { type: string }

  responses:
    BadRequest:
      description: Validation error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: Not authenticated
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: Not authorized
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: Conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    Money:
      type: string
      pattern: '^-?\d+(\.\d{1,2})?$'
      description: Decimal money as string
      example: "1000000.00"
    Percent:
      type: string
      pattern: '^\d+(\.\d{1,4})?$'
      example: "18.00"
    Role:
      type: string
      enum: [Administrator, DataEntryOperator, Engineer, Accounts, Viewer]
    WorkStatus:
      type: string
      enum: [Planned, InProgress, Hold, Completed]
    GstType:
      type: string
      enum: [GstExtra, GstIncluded]
    Side:
      type: string
      enum: [LHS, RHS, Both]
    TrafficLight:
      type: string
      enum: [Green, Yellow, Red]
    BillType:
      type: string
      enum: [RaBill, FinalBill]
    PaymentStatus:
      type: string
      enum: [Pending, PartiallyReceived, FullyReceived]
    ExpenseType:
      type: string
      enum: [WorkSpecific, General]
    ExpenseStatus:
      type: string
      enum: [Draft, Paid, AssignedToWork, Cancelled]
    PaymentMode:
      type: string
      enum: [Cash, BankTransfer, Cheque, UPI]
    MasterType:
      type: string
      enum:
        - work-categories
        - document-types
        - deduction-heads
        - expense-categories
        - client-department-formats
    ReportType:
      type: string
      enum:
        - work-register
        - billing
        - expenditure
        - financial-summary
        - work-wise-summary
        - pending-payment
        - document-register
        - general-expense
        - dashboard-summary
    BackupStatus:
      type: string
      enum: [Success, Failed, Running]
    ExportFormat:
      type: string
      enum: [pdf, excel]

    ProblemDetails:
      type: object
      required: [title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          description: Machine-stable error code
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
              code: { type: string }

    PageMeta:
      type: object
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        totalItems: { type: integer }
        totalPages: { type: integer }

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }
        rememberMe: { type: boolean, default: false }

    LoginResponse:
      type: object
      required: [user]
      properties:
        user: { $ref: '#/components/schemas/User' }
        token:
          type: string
          description: Optional bearer token if not using cookie-only sessions
        expiresAt: { type: string, format: date-time }

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword, confirmNewPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 8 }
        confirmNewPassword: { type: string, minLength: 8 }

    User:
      type: object
      required: [id, name, loginId, role, active]
      properties:
        id: { type: string }
        name: { type: string }
        loginId: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        mobile: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }

    UserCreateRequest:
      type: object
      required: [name, loginId, password, role]
      properties:
        name: { type: string, minLength: 1 }
        loginId: { type: string, minLength: 1 }
        password: { type: string, minLength: 8 }
        role: { $ref: '#/components/schemas/Role' }
        mobile: { type: string }
        email: { type: string, format: email }
        active: { type: boolean, default: true }

    UserUpdateRequest:
      type: object
      properties:
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        mobile: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true }
        active: { type: boolean }
