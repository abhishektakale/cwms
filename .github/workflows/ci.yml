name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cwms
          POSTGRES_PASSWORD: cwms_dev_password
          POSTGRES_DB: cwms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cwms -d cwms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://cwms:cwms_dev_password@localhost:5432/cwms?schema=public
      API_PREFIX: api/v1
      CORS_ORIGIN: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm install

      - name: Prisma generate
        run: npm run prisma:generate -w backend

      - name: Lint
        run: npm run lint

      - name: Test backend
        run: npm run test -w backend

      - name: Build
        run: npm run build
