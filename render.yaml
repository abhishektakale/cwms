# Render Blueprint — Free tier Node API (no Docker required)
# Path B: deploy/path-b/RENDER.md
#
# After create: set DATABASE_URL + CORS_ORIGIN in the dashboard.

services:
  - type: web
    name: cwms-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build -w backend
    startCommand: sh deploy/render/start.sh
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: api/v1
      - key: CWMS_SEED
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: COOKIE_SECURE
        value: "true"
      - key: DOCUMENTS_UPLOAD_ENABLED
        value: "false"
      - key: PROFIT_LOSS_MODE
        value: gross_minus_expenditure
      - key: SESSION_IDLE_TIMEOUT_MINUTES
        value: "30"
      - key: REMEMBER_ME_DAYS
        value: "14"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
