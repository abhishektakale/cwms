# Render Blueprint — API only (Neon + MinIO/R2 + SPA are external)
# Path B guide: deploy/path-b/README.md
# Default S3_FORCE_PATH_STYLE=true suits MinIO; set false in dashboard for Cloudflare R2.

services:
  - type: web
    name: cwms-api
    runtime: docker
    dockerfilePath: ./deploy/docker/Dockerfile.backend
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: API_PREFIX
        value: api/v1
      - key: CWMS_SEED
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: COOKIE_SECURE
        value: "true"
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: S3_REGION
        value: us-east-1
      - key: PROFIT_LOSS_MODE
        value: gross_minus_expenditure
      - key: SESSION_IDLE_TIMEOUT_MINUTES
        value: "30"
      - key: REMEMBER_ME_DAYS
        value: "14"
      # Set these in the dashboard (sync: false) — never commit secrets
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET_DOCUMENTS
        sync: false
      - key: S3_BUCKET_BACKUPS
        sync: false
